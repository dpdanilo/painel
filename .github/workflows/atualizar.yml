name: Atualizar layout do dashboard
on: workflow_dispatch
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trocar o layout mantendo os dados
        run: python3 convert.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza o layout do dashboard" || echo "Nada mudou"
          git push
