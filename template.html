<script>
const D=__DATA__,S=D.S,$=s=>document.querySelector(s),root=document.documentElement;
const DARK=()=>root.classList.contains('dark');
try{const t=localStorage.getItem('th');if(t?t==='d':matchMedia('(prefers-color-scheme:dark)').matches)root.classList.add('dark')}catch(e){}
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const sg=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));
const pc=(x,d=1)=>(x*100).toFixed(d).replace('.',',')+'%';
const pp=x=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(1).replace('.',',')+' p.p.';
const cap=s=>String(s).toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FM={s:v=>v==null?'':v,n:v=>v==null?'':fmt(v),d:v=>v==null?'':sg(v),p:v=>v==null?'':pc(v),q:v=>v==null?'':pp(v),x:v=>v==null?'':Number(v).toFixed(5)};
const asc=s=>String(s).replace(/−/g,'-').replace(/→/g,'->').replace(/·/g,'-').replace(/Δ/g,'Var.');
const KS=['a22','b22','l22','v22','o22','a26','b26','l26','v26','o26','cu26','rs26','ze26','ca26'];
function derive(o){o.r22=o.a22?o.b22/o.a22:0;o.r26=o.a26?o.b26/o.a26:0;
 if(o.perda===undefined)o.perda=Math.max(o.a26*(o.r26-o.r22),0)*(o.l22/Math.max(o.a22-o.b22,1));
 o.dl=o.l26-o.l22;o.dab=(o.r26-o.r22)*100;o.p22=o.v22?o.l22/o.v22:0;o.p26=o.v26?o.l26/o.v26:0;
 o.q22=o.v22?o.o22/o.v22:0;o.q26=o.v26?o.o26/o.v26:0;
 o.ou26=Math.max(o.v26-o.l26-o.o26-o.cu26-o.rs26-o.ze26-o.ca26,0);const z=o.v26||1;o.pcu=o.cu26/z;o.prs=o.rs26/z;o.pze=o.ze26/z;o.pca=o.ca26/z;o.pou=o.ou26/z;return o}
function agg(rows){const o={n:rows.length,perda:0};KS.forEach(k=>o[k]=0);
 rows.forEach(r=>{KS.forEach(k=>o[k]+=r[k]);o.perda+=r.perda});return derive(o)}
const PA=D.rows.map((r,i)=>derive({i,uf:D.uf[r[0]],city:D.city[r[1]],bairro:D.bairro[r[2]],zona:r[3],lat:r[4],lon:r[5],
 nm:r[6]||'',end:r[7]||'',a22:r[8],b22:r[9],l22:r[10],v22:r[11],o22:r[12],a26:r[13],b26:r[14],l26:r[15],v26:r[16],o26:r[17],cu26:r[18],rs26:r[19],ze26:r[20],ca26:r[21]}));
const P=PA.filter(o=>o.uf!=='ZZ'); // mapa/filtros: sem exterior
const M={perda:{n:'Perda estimada p/ abstenção (votos de Lula)',f:o=>o.perda},
 dl:{n:'Queda de votos de Lula',f:o=>Math.max(-o.dl,0)},
 dab:{n:'Aumento da abstenção (p.p.)',f:o=>Math.max(o.dab,0)}};
const COLS=['#fff3b0','#fdc65c','#f59a3b','#d2641f','#8f3a14'],BR={};
function brk(k){if(!BR[k]){const v=P.map(M[k].f).filter(x=>x>0).sort((a,b)=>a-b);
 BR[k]=[.5,.75,.9,.97].map(q=>v[Math.floor(q*(v.length-1))]||0)}return BR[k]}
function colr(v,k){if(v<=0)return '#8da0b3';const b=brk(k);let i=0;while(i<4&&v>b[i])i++;return COLS[i]}
const topBy=(rows,keyf,n)=>{const m=new Map();rows.forEach(r=>{const k=keyf(r);let a=m.get(k);if(!a)m.set(k,a=[]);a.push(r)});
 return [...m.values()].map(rs=>({rs,o:agg(rs)})).sort((x,y)=>y.o.perda-x.o.perda).slice(0,n)};
const place=o=>o.uf==='ZZ'?esc(o.city)+' (exterior)':esc(o.city)+'/'+o.uf,ufl=o=>o.uf==='ZZ'?'Exterior':o.uf;
let _rm,_rb;const RM=()=>_rm||(_rm=topBy(PA,o=>o.uf+'|'+o.city,Infinity)),RB=()=>_rb||(_rb=topBy(P.filter(o=>o.bairro&&o.bairro[0]!=='('),o=>o.uf+'|'+o.city+'|'+o.bairro,Infinity));

/* ---------- EXPORTAÇÃO ---------- */
const xb=(k,tbl)=>`<span class="xb">${tbl?`<button data-x="pdf" data-k="${k}" title="Baixar PDF">PDF</button><button data-x="xls" data-k="${k}" title="Baixar Excel">Excel</button>`:''}<button data-x="png" title="Baixar imagem">PNG</button></span>`;
const AGGH=['Aptos 2022','Aptos 2026','Abstenção 2022','Abstenção 2026','Var. abstenção (p.p.)','Lula 2022','Lula 2026','Var. Lula','Lula % válidos 2022','Lula % válidos 2026','Bolsonaro 2022','Bolsonaro 2026','Bolsonaro % válidos 2022','Bolsonaro % válidos 2026','Cury 2026','Renan Santos 2026','Zema 2026','Caiado 2026','Outros 2026','Cury % válidos 2026','Renan Santos % válidos 2026','Zema % válidos 2026','Caiado % válidos 2026','Outros % válidos 2026','Votos a recuperar (estimativa)'];
const AGGT=['n','n','p','p','q','n','n','d','p','p','n','n','p','p','n','n','n','n','n','p','p','p','p','p','n'];
const aggVals=o=>[o.a22,o.a26,o.r22,o.r26,o.dab,o.l22,o.l26,o.dl,o.p22,o.p26,o.o22,o.o26,o.q22,o.q26,o.cu26,o.rs26,o.ze26,o.ca26,o.ou26,o.pcu,o.prs,o.pze,o.pca,o.pou,o.perda];
function locSpec(t,rows,dist){const h=['UF','Município','Zona','Bairro','Local de votação','Endereço','Latitude','Longitude',...AGGH],ty=['s','s','s','s','s','s','x','x',...AGGT];
 if(dist){h.push('Distância (km)');ty.push('x')}
 return {t,sheet:'Locais',h,ty,r:rows.map(o=>{const r=[ufl(o),o.city,o.zona,cap(o.bairro),o.nm,o.end,o.lat,o.lon,...aggVals(o)];if(dist)r.push(o.dist);return r})}}
const TB={};
let CMP=[];
TB.cmp=()=>({t:'Comparativo nacional: 2º turno 2022 x 1º turno 2026',sheet:'Comparativo',h:['Indicador','2º t. 2022','1º t. 2026','Variação','Variação %'],ty:['s','n','n','d','p'],r:CMP.map(([n,x,y])=>[n,x,y,y-x,x?y/x-1:null])});
TB.topm=()=>({t:'Municípios por perda estimada para a abstenção (locais comparáveis)',sheet:'Municipios',h:['UF','Município','Locais',...AGGH],ty:['s','s','n',...AGGT],r:RM().map(t=>[ufl(t.rs[0]),t.rs[0].city,t.o.n,...aggVals(t.o)])});
TB.topb=()=>({t:'Bairros por perda estimada para a abstenção (locais comparáveis)',sheet:'Bairros_Brasil',h:['UF','Município','Bairro','Locais',...AGGH],ty:['s','s','s','n',...AGGT],r:RB().map(t=>[t.rs[0].uf,t.rs[0].city,cap(t.rs[0].bairro),t.o.n,...aggVals(t.o)])});
let groups=[],rowsAll=[],cur=[],SC=[],near=null;
TB.bairros=()=>({t:'Bairros no filtro atual',sheet:'Bairros',h:['UF','Município','Bairro','Locais',...AGGH],ty:['s','s','s','n',...AGGT],r:groups.map(G=>[G.rs[0].uf,G.rs[0].city,cap(G.rs[0].bairro),G.o.n,...aggVals(G.o)])});
TB.locais=()=>locSpec('Locais de votação no filtro atual',near?rowsAll.slice().sort((x,y)=>x.dist-y.dist):rowsAll,!!near);
TB.resumo=()=>({t:'Resumo da área selecionada',sheet:'Resumo',h:['Escopo','Nome','Locais',...AGGH],ty:['s','s','n',...AGGT],r:SC.length?SC.map(s=>[s.escopo,s.nome,s.o.n,...aggVals(s.o)]):[['Brasil, exceto exterior (comparáveis)','Todos',P.length,...aggVals(agg(P))]]});
const need=n=>alert('A biblioteca de exportação ('+n+') não carregou. Verifique a conexão com a internet.');
const stamp=()=>new Date().toISOString().slice(0,10).replace(/-/g,'');
function xls(specs,name){if(!window.XLSX)return need('Excel');const wb=XLSX.utils.book_new();
 specs.forEach(sp=>{const ws=XLSX.utils.aoa_to_sheet([sp.h,...sp.r]);
  sp.ty.forEach((t,c)=>{if(t==='p')for(let r=1;r<=sp.r.length;r++){const a=ws[XLSX.utils.encode_cell({r,c})];if(a&&typeof a.v==='number')a.z='0.0%'}});
  ws['!cols']=sp.h.map((h,c)=>({wch:Math.min(48,Math.max(String(h).length+2,sp.ty[c]==='s'?18:12))}));
  XLSX.utils.book_append_sheet(wb,ws,String(sp.sheet).slice(0,31))});
 XLSX.writeFile(wb,name+'_'+stamp()+'.xlsx')}
function pdf(sp,name){if(!window.jspdf)return need('PDF');const LIM=1500,doc=new window.jspdf.jsPDF({orientation:sp.h.length>6?'l':'p',unit:'pt',format:'a4'});
 doc.setFontSize(13);doc.text(asc(sp.t),36,36);doc.setFontSize(8);
 doc.text(asc(sp.r.length>LIM?`Primeiras ${LIM} de ${sp.r.length} linhas. Baixe o Excel para a tabela completa.`:'Fonte: TSE (dados abertos). Cálculos próprios; perda estimada é contrafactual.'),36,50);
 doc.autoTable({head:[sp.h.map(asc)],body:sp.r.slice(0,LIM).map(r=>r.map((v,i)=>asc(FM[sp.ty[i]](v)))),startY:60,styles:{fontSize:7,cellPadding:3},headStyles:{fillColor:[59,111,143]},margin:{left:36,right:36}});
 doc.save(name+'_'+stamp()+'.pdf')}
async function png(el,name,asPdf){if(!window.html2canvas)return need('imagem');
 const dk=DARK(),isMap=el.id==='map';if(isMap&&dk)root.classList.remove('dark');
 try{const c=await html2canvas(el,{useCORS:true,scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,
   ignoreElements:n=>n.classList&&(n.classList.contains('xb')||n.classList.contains('leaflet-control-zoom'))});
  if(asPdf){if(!window.jspdf)return need('PDF');const doc=new window.jspdf.jsPDF({orientation:'l',unit:'pt',format:'a4'}),pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();
   let w=pw-72,h=w*c.height/c.width;if(h>ph-80){h=ph-80;w=h*c.width/c.height}
   doc.setFontSize(12);doc.text(asc('Mapa de locais de votação - '+(near?'perto de '+near.label.split(',')[0]:f.city?f.city+'/'+f.uf:f.uf||'Brasil')),36,32);
   doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',36,44,w,h);doc.save(name+'_'+stamp()+'.pdf')}
  else{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=name+'_'+stamp()+'.png';a.click()}
 }catch(e){alert('Não foi possível gerar a imagem: '+e.message)}finally{if(isMap&&dk)root.classList.add('dark')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;e.preventDefault();const x=b.dataset.x,k=b.dataset.k;
 if(x==='xls'){const ks=k.split('+');xls(ks.map(q=>TB[q]()),ks.length>1?'dashboard':k)}
 else if(x==='pdf')pdf(TB[k](),k);
 else{const el=k==='mapa'?$('#map'):k==='tela'?document.querySelector('main section:not(.hide)'):b.closest('.card,.bc');if(el)png(el,k||'cartao',b.dataset.f==='pdf')}});
$('#th').onclick=()=>{root.classList.toggle('dark');try{localStorage.setItem('th',DARK()?'d':'l')}catch(e){}
 if(!$('#s2').classList.contains('hide'))drawSoon()};

/* ---------- RESUMO ---------- */
const a=S.y22,b=S.y26,ar=a.abst/a.aptos,br=b.abst/b.aptos;
const perdaTot=PA.reduce((s,o)=>s+o.perda,0);
const mi=(n,d=1)=>{const v=Math.abs(n);return v>=1e6?(n/1e6).toFixed(d).replace('.',',')+' mi':v>=1e3?fmt(n/1e3)+' mil':fmt(n)};
const miP=n=>{const v=Math.abs(n);return v>=1e6?[(n/1e6).toFixed(1).replace('.',','),'milhões']:v>=1e3?[fmt(n/1e3),'mil']:[fmt(n),'votos']};
const sgM=n=>(n>0?'+':n<0?'−':'')+mi(Math.abs(n));
const nan26=Math.max(b.validos-b.lula-b.opp,0),meta=b.opp-b.lula,lossL=a.lula-b.lula;
const partAbst=Math.max(0,Math.min(perdaTot,Math.max(lossL,0))),partNan=Math.max(lossL,0)-partAbst;
const top50c=RM().slice(0,50),top50b=RB().slice(0,50);
const sum50c=top50c.reduce((s,t)=>s+t.o.perda,0),sum50b=top50b.reduce((s,t)=>s+t.o.perda,0);
const lead=meta>=0,mp=miP(Math.abs(meta));
$('#hero').innerHTML=`<div class="hl">${lead?'A META':'A VANTAGEM'}</div><div class="hn"><span>${mp[0]}</span><small>${mp[1]}</small></div>
 <div class="hs">${lead?'de votos separam Lula de Bolsonaro no 1º turno de 2026':'de votos a mais para Lula que para Bolsonaro no 1º turno de 2026'}</div>
 <div class="hv"><div><span>Bolsonaro</span><b>${mi(b.opp)}</b></div><div><span>Lula</span><b>${mi(b.lula)}</b></div></div>`;
$('#msg').innerHTML=lossL>0?`<h2 class="mh">${mi(lossL)} de votos de Lula em 2022 não estão com ele agora</h2><p class="ms">Já votaram nele antes: há votos para recuperar.</p>
 <div class="split2" role="img" aria-label="Divisão estimada entre abstenção e nanicos"><i class="s-ab" style="flex:${partAbst||0.0001}"></i><i class="s-na" style="flex:${partNan||0.0001}"></i></div>
 <div class="two"><button class="wb" data-ov="abst"><span class="wl"><i class="sq s-ab"></i>Abstenção</span><span class="wv"><b>${mi(partAbst)}</b><em>Detalhes ›</em></span></button>
 <button class="wb" data-ov="nan"><span class="wl"><i class="sq s-na"></i>Nanicos</span><span class="wv"><b>${mi(partNan)}</b><em>Detalhes ›</em></span></button></div>`
 :`<h2 class="mh">Lula tem ${mi(-lossL)} votos a mais que em 2022</h2><p class="ms">Ainda assim há votos a recuperar onde a abstenção cresceu: veja abaixo.</p>`;
$('#where').innerHTML=`<button class="wh" data-ov="cidades"><span><b>${mi(sum50c)}</b> a recuperar nas 50 cidades com mais votos a recuperar</span><i>›</i></button>
 <button class="wh" data-ov="bairros"><span><b>${mi(sum50b)}</b> a recuperar nos 50 bairros com mais votos a recuperar</span><i>›</i></button>`;
const nrow=(t,sub,val,cls)=>`<div class="nrow"><div><b>${t}</b><span>${sub}</span></div><strong class="${cls||''}">${val}</strong></div>`;
$('#nums').innerHTML=nrow('Votos de Lula',`${mi(a.lula)} → ${mi(b.lula)}`,sgM(b.lula-a.lula),b.lula<a.lula?'bad':'good')
 +nrow('Abstenção',`${mi(a.abst)} → ${mi(b.abst)}`,sgM(b.abst-a.abst),b.abst>a.abst?'bad':'good')
 +nrow('Nanicos','Cury, Caiado, Renan e todos os demais, exceto Bolsonaro · o 2º turno de 2022 teve só 2 candidatos',mi(nan26),'');
/* detalhes (tudo o que já existia, sob demanda) */
const kp=(t,v,s)=>`<div class="card"><h3><span>${t}</span>${xb('',false)}</h3><div class="big">${v}</div><div class="sm mut">${s}</div></div>`;
$('#kpis').innerHTML=kp('Eleitorado apto',fmt(b.aptos),`2022: ${fmt(a.aptos)} · ${sg(b.aptos-a.aptos)} (${pc(b.aptos/a.aptos-1)})`)
 +kp('Abstenção',pc(br),`2022: ${pc(ar)} · <b class="${br>ar?'up':'dn'}">${pp((br-ar)*100)}</b>`)
 +kp('Votos de Lula',fmt(b.lula),`2º turno 2022: ${fmt(a.lula)} · <b class="${b.lula<a.lula?'up':'dn'}">${sg(b.lula-a.lula)}</b>`)
 +kp('Votos de Bolsonaro',fmt(b.opp),`2º turno 2022 (Jair): ${fmt(a.opp)} · <b>${sg(b.opp-a.opp)}</b> (2026: Flávio)`)
 +kp('Votos a recuperar (abstenção)',fmt(perdaTot),`votos de Lula · estimativa · cobre ${pc(S.cover)} dos válidos de 2026`);

function render(fit){
 const fn=M[mk].f;rowsAll=selRows();
 cur=rowsAll.filter(o=>o.lat!=null).sort((x,y)=>fn(y)-fn(x));missing=rowsAll.length-cur.length;
 groups=topBy(rowsAll,o=>o.city+'|'+o.bairro+'|'+o.uf,Infinity);
 renderSheet();renderChips();renderLegend();
 nearLay.clearLayers();let nb=null;
 if(near){const c=L.circle([near.lat,near.lon],{radius:near.r*1000,color:'#3b6f8f',weight:2,dashArray:'6 6',fillOpacity:.05});nearLay.addLayer(c);
  nearLay.addLayer(L.circleMarker([near.lat,near.lon],{radius:8,color:'#fff',weight:2,fillColor:'#2a6fdb',fillOpacity:1}).bindTooltip('Ponto buscado'));nb=c.getBounds()}
 if(fit&&(nb||cur.length))map.fitBounds(nb||boundsOf(cur),{animate:false,maxZoom:16,padding:[20,20]});
 drawSoon()}
/* painel (gaveta no celular) */
const sideEl=$('#side'),sOpen=v=>{sideEl.classList.toggle('open',v);$('#s2').classList.toggle('sheetopen',v);$('#shBtn').textContent=v?'Voltar ao mapa ▼':'Ver resumo ▲'};
$('#sheetHead').onclick=()=>sOpen(!sideEl.classList.contains('open'));
$('#sheetHead').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sOpen(!sideEl.classList.contains('open'))}});
function flyTo(pts){if(!pts.length)return;if(MOB())sOpen(false);map.invalidateSize();map.fitBounds(boundsOf(pts),{maxZoom:17,padding:[40,40]})}
$('#sheetBody').addEventListener('click',e=>{
 const g=e.target.closest('[data-g]');if(g){const d=g.nextElementSibling,open=d.classList.toggle('hide');g.setAttribute('aria-expanded',String(!open));
  if(!d.dataset.done){d.dataset.done=1;const it=LST[+g.dataset.g];d.innerHTML=gDet(it.G,it.mode)}return}
 const dt=e.target.closest('[data-det]');if(dt){const d=$('#sdet'+dt.dataset.det),h=d.classList.toggle('hide');dt.textContent=h?'Ver detalhes ▾':'Ocultar detalhes ▴';dt.setAttribute('aria-expanded',String(!h));return}
 const vt=e.target.closest('[data-vt]');if(vt){vtab=vt.dataset.vt;pageN=30;renderSheet();return}
 if(e.target.closest('[data-more]')){pageN+=30;renderSheet();return}
 const fl=e.target.closest('[data-fly]');if(fl){flyTo(LST[+fl.dataset.fly].G.rs.filter(o=>o.lat!=null));return}
 const pt=e.target.closest('[data-pt]');if(pt){const o=LST[+pt.dataset.pt].o;if(MOB())sOpen(false);map.invalidateSize();map.setView([o.lat,o.lon],17);L.popup({maxWidth:300}).setLatLng([o.lat,o.lon]).setContent(tip(o)).openOn(map)}});
/* legenda e troca de medida */
$('#legend').addEventListener('click',e=>{if(e.target.closest('[data-lg]')){lgOpen=!lgOpen;renderLegend();return}
 const m=e.target.closest('[data-m]');if(m){mk=m.dataset.m;lgOpen=false;pageN=30;render(false)}});
/* ---------- BUSCA ÚNICA: áreas (filtram tudo) e pontos (raio de 2 km) ---------- */
const aIn=$('#addr'),aUl=$('#addrList');let aLoc=[],aPh=[],aItems=[],aHi=-1,aT,aCtl,aSeq=0,aMsg='',GEO=null,LOCX=null;
function geoIdx(){if(GEO)return;const m=new Map();
 P.forEach(o=>{const kc=o.uf+'|'+o.city;if(!m.has(kc))m.set(kc,{k:'city',uf:o.uf,city:o.city,n:nrm(o.city)});
  if(o.bairro&&o.bairro[0]!=='('){const kb=kc+'|'+o.bairro;if(!m.has(kb))m.set(kb,{k:'bairro',uf:o.uf,city:o.city,bairro:o.bairro,n:nrm(o.bairro)})}});
 GEO=[...m.values()];LOCX=P.map(o=>nrm(o.nm+' '+o.end))}
function localSug(q){geoIdx();const n=nrm(q),sc=x=>x.n.startsWith(n)?0:1,out=[];
 const pk=(k,max)=>GEO.filter(x=>x.k===k&&x.n.includes(n)).sort((x,y)=>sc(x)-sc(y)).slice(0,max);
 UFS.filter(u=>nrm(UFN[u]||u).includes(n)||nrm(u)===n).slice(0,2).forEach(u=>out.push({g:'area',k:'uf',t:ufName(u),s:'Estado · '+u,hint:'todo o estado',uf:u}));
 pk('city',4).forEach(x=>out.push({g:'area',k:'city',t:x.city,s:'Cidade · '+x.uf,hint:'toda a cidade',uf:x.uf,city:x.city}));
 pk('bairro',4).forEach(x=>out.push({g:'area',k:'bairro',t:cap(x.bairro),s:'Bairro · '+x.city+'/'+x.uf,hint:'todo o bairro',uf:x.uf,city:x.city,bairro:x.bairro}));
 let c=0;for(let i=0;i<P.length&&c<4;i++){const o=P[i];if(o.lat!=null&&LOCX[i].includes(n)){out.push({g:'pt',k:'local',t:o.nm,s:'Local de votação · '+o.end+' · '+o.city+'/'+o.uf,hint:'raio '+RAD+' km',lat:o.lat,lon:o.lon,label:o.nm});c++}}
 return out}
function paintAddr(){aItems=[{g:'geo',k:'geo',t:'Usar minha localização',s:'',hint:'raio '+RAD+' km'},...aLoc.filter(x=>x.g==='area'),...aLoc.filter(x=>x.g==='pt'),...aPh];
 const GL={geo:'',area:'MOSTRAR TODA A ÁREA',pt:'PERTO DE UM PONTO (raio de '+RAD+' km)'};let h='',last='';
 aItems.forEach((it,i)=>{const g=it.g==='geo'?'geo':it.g||'pt';if(g!==last&&GL[g]){h+=`<li class="gh2" style="padding:10px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--mut)">${GL[g]}</li>`}last=g;
  h+=`<li role="option" data-i="${i}" class="${i===aHi?'on':''}"><b>${esc(it.t)}</b>${it.s?`<span>${esc(it.s)}</span>`:''}<small style="float:right;color:var(--mut);font-size:11px">${esc(it.hint||'')}</small></li>`});
 if(aMsg)h+=`<li class="none">${esc(aMsg)}</li>`;aUl.innerHTML=h;aUl.classList.remove('hide')}
const closeAddr=()=>aUl.classList.add('hide');
async function photon(q,my){try{if(aCtl)aCtl.abort();aCtl=new AbortController();const c=map.getCenter();
  const url='https://photon.komoot.io/api/?limit=5&bbox=-74,-34,-34,6&q='+encodeURIComponent(q)+(map.getZoom()>=7?`&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}`:'');
  const j=await (await fetch(url,{signal:aCtl.signal})).json();if(my!==aSeq)return;
  aPh=(j.features||[]).map(ft=>{const p=ft.properties,[lon,lat]=ft.geometry.coordinates,st=p.street?p.street+(p.housenumber?', '+p.housenumber:''):'',t=p.name||st||p.city||'',
   sub=[p.name&&st&&p.name!==p.street?st:'',p.district,p.city&&p.city!==t?p.city:'',p.state].filter(Boolean).join(', ');return{g:'pt',k:'end',t,s:'Endereço · '+sub,hint:'raio '+RAD+' km',lat,lon,label:[t,sub].filter(Boolean).join(', ')}});
  aMsg=aPh.length||aLoc.length?'':'Nenhuma sugestão. Tente incluir cidade e UF.'}
 catch(e){if(e.name==='AbortError')return;aPh=[];aMsg=aLoc.length?'':'Sugestões de endereço indisponíveis (requer internet).'}
 paintAddr()}
const setArea=(uf,city,bairro,label)=>{near=null;f.uf=uf;f.city=city||'';f.bairro=bairro||'';aIn.value=label;vtab='';pageN=30;closeAddr();render(true)};
function setNear(lat,lon,label){near={lat,lon,label,r:RAD};f.uf=f.city=f.bairro='';aIn.value=label.split(',')[0];vtab='main';pageN=30;closeAddr();render(true)}
function geolocate(){if(!navigator.geolocation){aMsg='Seu navegador não oferece localização.';return paintAddr()}
 navigator.geolocation.getCurrentPosition(p=>setNear(p.coords.latitude,p.coords.longitude,'Sua localização'),er=>{aMsg='Não foi possível obter a localização ('+er.message+'). Abra via http://localhost ou hospedado (https) e permita o acesso.';aUl.classList.remove('hide');paintAddr()})}
function pickAddr(i){const it=aItems[i];if(!it)return;
 if(it.k==='geo')return geolocate();
 if(it.k==='uf')setArea(it.uf,'','',it.t);else if(it.k==='city')setArea(it.uf,it.city,'',it.t);else if(it.k==='bairro')setArea(it.uf,it.city,it.bairro,it.t);
 else setNear(it.lat,it.lon,it.label||it.t)}
function clearAll(){near=null;f.uf=f.city=f.bairro='';aIn.value='';aLoc=[];aPh=[];aMsg='';vtab='';pageN=30;closeAddr();render(true)}
async function doSearch(){const q=aIn.value.trim();if(!q)return;aMsg='Buscando…';paintAddr();
 try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&q='+encodeURIComponent(q)),j=await r.json();
  if(!j[0]){aMsg='Endereço não encontrado. Tente incluir cidade e UF.';return paintAddr()}setNear(+j[0].lat,+j[0].lon,j[0].display_name)}
 catch(e){aMsg='Falha na busca (requer internet).';paintAddr()}}
aIn.addEventListener('input',()=>{clearTimeout(aT);const q=aIn.value.trim();aHi=-1;$('#sClr').classList.toggle('hide',!aIn.value&&!near&&!f.uf);
 if(q.length<2){aLoc=[];aPh=[];aMsg='';return paintAddr()}
 aLoc=localSug(q);aPh=[];aMsg=q.length>=3?'Buscando endereços…':'';paintAddr();if(q.length>=3){const my=++aSeq;aT=setTimeout(()=>photon(q,my),380)}});
aIn.addEventListener('focus',()=>{aIn.select();paintAddr()});
aIn.addEventListener('blur',()=>setTimeout(closeAddr,160));
aIn.addEventListener('keydown',e=>{const n=aItems.length;
 if((e.key==='ArrowDown'||e.key==='ArrowUp')&&n){e.preventDefault();const d=e.key==='ArrowDown';aHi=aHi<0?(d?0:n-1):(aHi+(d?1:-1)+n)%n;paintAddr();const el=aUl.querySelector('.on');if(el)el.scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'){e.preventDefault();if(aHi>=0)pickAddr(aHi);else if(aItems.length>1)pickAddr(1);else doSearch()}
 else if(e.key==='Escape')closeAddr()});
aUl.addEventListener('pointerdown',e=>{const li=e.target.closest('li[data-i]');if(!li)return;e.preventDefault();pickAddr(+li.dataset.i)});
$('#bGeo').onclick=geolocate;$('#sClr').onclick=clearAll;
$('#chips').addEventListener('click',e=>{if(e.target.closest('[data-clr]'))clearAll()});
/* navegação */
function gotoMap(sel){closeOv();near=null;f.uf=sel.uf;f.city=sel.city||'';f.bairro=sel.bairro||'';aIn.value=sel.bairro?cap(sel.bairro):sel.city||ufName(sel.uf);vtab='';pageN=30;tab(2)}
function tab(n){$('#s1').classList.toggle('hide',n!==1);$('#s2').classList.toggle('hide',n!==2);
 ['t1','t2'].forEach((id,k)=>$('#'+id).classList.toggle('on',n===k+1));['bn1','bn2'].forEach((id,k)=>$('#'+id).classList.toggle('on',n===k+1));
 root.classList.toggle('nsc',n===2&&MOB());closeOv();if(n===1)window.scrollTo(0,0);
 if(n===2){sOpen(false);setTimeout(()=>{map.invalidateSize();render(true)},50)}}
$('#t1').onclick=$('#bn1').onclick=()=>tab(1);$('#t2').onclick=$('#bn2').onclick=()=>tab(2);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{root.classList.toggle('nsc',!$('#s2').classList.contains('hide')&&MOB());map.invalidateSize();drawSoon()},150)});

</script></body></html>
